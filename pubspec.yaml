name: gym_monitor
description: Aplikasi monitoring member gym
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  barcode_widget: ^2.0.4
  share_plus: ^11.0.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/kartu/
    - assets/images/app_logo.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

dependency_overrides:
  archive: ^4.0.10